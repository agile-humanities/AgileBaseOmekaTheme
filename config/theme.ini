[info]
name = "Advanced Agile Base Theme"
version = "2.0.0-dev"
author = "Agile Humanities Agency"
description = "A full-featured base theme for Omeka S collections sites: carousel homepage, faceted search, block-based item pages and managed media display. Requires the Agile Theme Tools module."
theme_link = "https://github.com/agile-humanities/AgileBaseOmekaTheme"
author_link = "https://agilehumanities.ca/"
omeka_version_constraint = "^4.2.0"

[config]
elements.nav_depth.name = "nav_depth"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Top Navigation Depth"
elements.nav_depth.options.info = "Maximum number of levels to show in the site's top navigation bar. Set to 0 to show all levels."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 0

elements.configurable_site_theme.name = "configurable_site_theme"
elements.configurable_site_theme.attributes.id = "configurable_site_theme"
elements.configurable_site_theme.type = "Laminas\Form\Element\Checkbox"
elements.configurable_site_theme.options.label = "Use theme configuration"
elements.configurable_site_theme.options.info = "Use configurable styles for this site. The configuration form will appear on the site’s Theme page when selected."
elements.configurable_site_theme.attributes.value = 0

elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"

elements.welcome_logo.name = "welcome_logo"
elements.welcome_logo.type = "Omeka\Form\Element\Asset"
elements.welcome_logo.options.label = "Site welcome banner logo"
elements.welcome_logo.options.info = "Shown in the homepage welcome panel. Use a transparent PNG or SVG that contrasts with the panel background (dark by default), wide and relatively short. Leave empty for no logo."

elements.footer_logo.name = "footer_logo"
elements.footer_logo.type = "Omeka\Form\Element\Asset"
elements.footer_logo.options.label = "Footer Logo"

elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "HTML content to appear in the footer"
elements.footer.attributes.value = "Powered by Agile Humanities"

elements.footer_links.name = "footer_links"
elements.footer_links.attributes.id = "footer_links"
elements.footer_links.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer_links.options.label = "Footer Links"
elements.footer_links.options.info = "HTML link content to appear in the footer"
elements.footer_links.attributes.value = "<nav><ul><li><a href='#'>Example Link</a></li></ul></nav>"

elements.footer_sponsor_logos.name = "footer_sponsor_logos"
elements.footer_sponsor_logos.type = "Omeka\Form\Element\Asset"
elements.footer_sponsor_logos.options.label = "Footer Sponsor Logos"
elements.footer_sponsor_logos.options.info = "An optional pre-made grid of sponsor/institutional logos"

elements.footer_sponsor_html.name = "footer_sponsor_html"
elements.footer_sponsor_html.attributes.id = "footer_sponsor_html"
elements.footer_sponsor_html.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer_sponsor_html.options.label = "Sponsor Area HTML"
elements.footer_sponsor_html.options.info = "Sponsor information for footer. Use in place of sponsor logos. Allows you to use more complex HTML to provide sponsor images with links"

; Related items are not displayed yet: the settings are kept for the item-page block that will use them.

elements.related_items.name = "related_items"
elements.related_items.attributes.id = "related_items"
elements.related_items.type = "Number"
elements.related_items.options.label = "Related Items"
elements.related_items.options.info = "Number of related items to display on an item page. Set to 0 to show all items."
elements.related_items.attributes.min = 0
elements.related_items.attributes.value = 6

elements.related_items_type.name = "related_items_type"
elements.related_items_type.attributes.id = "related_items_type"
elements.related_items_type.type = "Laminas\Form\Element\Text"
elements.related_items_type.options.label = "Related Items Field"
elements.related_items_type.options.info = "The field to use to determine related items. Use the field key, e.g. dcterms:subject"

resource_page_regions.items.above = "Above Main"
resource_page_regions.items.main = "Main"

resource_page_blocks.items.above[] = "advancedMedia"
resource_page_blocks.items.above[] = "itemHeading"
resource_page_blocks.items.above[] = "advancedMediaDownloads"
resource_page_blocks.items.above[] = "itemSummary"

; Property lists use the AgileThemeTools PropertyList element: a searchable picker and draggable lozenges,
; saved as a comma-delimited list of terms, e.g. “dcterms:temporal,dcterms:language”.

elements.card_terms.name = "card_terms"
elements.card_terms.attributes.id = "card_terms"
elements.card_terms.type = "AgileThemeTools\Form\Element\PropertyList"
elements.card_terms.options.label = "Card Terms"
elements.card_terms.options.info = "Metadata to display on cards, aside from the title and creator, in this order. Drag to reorder."
elements.card_terms.options.empty_label = "None selected: cards show Date Created and Date."

elements.key_terms.name = "key_terms"
elements.key_terms.attributes.id = "key_terms"
elements.key_terms.type = "AgileThemeTools\Form\Element\PropertyList"
elements.key_terms.options.label = "Item Summary Key Terms"
elements.key_terms.options.info = "Metadata to display in the item Summary, aside from the title and creator, in this order. Drag to reorder."
elements.key_terms.options.empty_label = "None selected: the Summary shows Date Created, Date, Time Period, Subject and Place."

elements.full_metadata_terms.name = "full_metadata_terms"
elements.full_metadata_terms.attributes.id = "full_metadata_terms"
elements.full_metadata_terms.type = "AgileThemeTools\Form\Element\PropertyList"
elements.full_metadata_terms.options.label = "Full Metadata Terms"
elements.full_metadata_terms.options.info = "Metadata to display in the item Full Metadata tab, in this order. Drag to reorder."
elements.full_metadata_terms.options.empty_label = "None selected: Full Metadata shows every property, alphabetically by label."
elements.full_metadata_terms.options.add_all = 1

elements.font_embed.name = "font_embed"
elements.font_embed.attributes.id = "font_embed"
elements.font_embed.type = "Laminas\Form\Element\Text"
elements.font_embed.options.label = "Other font embed code"
elements.font_embed.options.info = "HTML to load fonts from a service other than Google Fonts, e.g. Adobe Fonts (Typekit). Google fonts are chosen under Configure theme styles and load automatically; do not paste their code here."
