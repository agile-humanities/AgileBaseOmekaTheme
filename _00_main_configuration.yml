## 00 GENERAL
dir_image: "'../img'"
asset_dirs: "('svg': $dir_image + '/svg','png': $dir_image + '/png', 'jpg': $dir_image + '/jpg')"
subdir_icons: "'/icons'"
subdir_marks: "'/marks'"
logo_path: "map-get($asset_dirs,'svg') + $subdir_marks + '/logo.svg'"

# KEY VALUES
rootsize: "100%"
base_line_height: 1.5
scale: 1.25
max_width: 1900px
legible_inset_width: 920px

# Fonts
# Note that fonts must be loaded to make them available.
# Font-loading can be configured in ./source/sass/00_configuration/_04_typography_fonts.sass
basefont: "Roboto, Tahoma, Arial, sans-serif"
headingfont: "Roboto, Tahoma, Arial, sans-serif"
altfont: "Georgia, serif"
labelfont: $basefont
listfont: $basefont
codefont: "'IBM Plex Mono', Monaco, Courier New, monospace"

# Font sizing / Fluid type
basetypesize: 1.1rem
default-min-bp: sml
default-max-bp: xlrg
min_sizefactors: "(base: -1, h1: 3, h2: 2, h3: 1, h4: 0, h5: -1, h6: -1)"
sizefactors: "(base: 0, h1: 7, h2: 3, h3: 2, h4: 1, h5: 0, h6: 0)"
line_heights: "(base: $base_line_height, h1: 1.1, h2: 1.25, h3: 1.25, h4: $base_line_height, h5: $base_line_height, h6: $base_line_height)"
typescale: "(base: 1, xsml: 1, sml: 1, med:1, lrg: 1, xlrg: 1, xxlrg: 1)"
paragraph_spacing: "clamped(map-get($min_sizefactors,'base'),map-get($sizefactors,'base'),$default-min-bp,$default-max-bp,map-get($line_heights,base))"

## 01 COLOUR AND PATTERNS

# Palette slots. Each slot has a role (see the generic requirements, section 7.3):
#   clr1  Primary brand colour; the default accent and the logo's key colour. Tested against every surface, never enforced.
#   clr2  Secondary brand colour; accent. Tested, never enforced.
#   clr3  Dark pole: the dark surface and the text colour on light surfaces. Dark but not $black.
#   clr4  Light pole: the light surface and the text colour on dark surfaces. Light but not $white.
#   clr5  Visual impact: buttons and calls to action. Its text colour is picked automatically.
#   clr6+ Further accents (later: data-visualisation colours). Tested, never enforced.
clr1: "#00BDD4"
clr2: "#BF609B"
clr3: "#0E3A40"
clr4: "#EAF3F4"
clr5: "#D98536"
clr6: "#315FAA"
clr7: "#7DBF60"
clr8: "#E1BB0B"
clr9: "#E5336D"

# Fixed reference points. Contrast is measured from these; surfaces default to them but are not pinned to them.
black: "#00171A"
white: white
true_black: "#000000"

# Colour roles (see the generic requirements, section 7.3, and the library's _01_configuration_colour_and_patterns.sass).
# The canvas and the surfaces form a continuum:  $black | $surface_dark | $surface_light | $white
# $white is the page, $black its inverse (the blackpoint); the surfaces are a small step in from each end, for panels
# that stand out from the page without contrasting with it. Text colours belong to a side: $on_light reads on $white
# and $surface_light, $on_dark on $black and $surface_dark.
surface_dark: $clr3
surface_light: $clr4
on_dark: $white
on_light: $black
visual_impact: $clr5
brand_primary: $clr1
brand_secondary: $clr2
# Derived roles, text class (4.5:1): restated here so the library computes them from this palette.
# A brand colour that reads on the surface is used as it is; otherwise a variant mixed toward the opposite fixed point.
on_impact: "on-colour($visual_impact)"
brand_primary_on_light: "ensure-contrast($brand_primary, $surface_light)"
brand_primary_on_dark: "ensure-contrast($brand_primary, $surface_dark)"
brand_secondary_on_light: "ensure-contrast($brand_secondary, $surface_light)"
brand_secondary_on_dark: "ensure-contrast($brand_secondary, $surface_dark)"
# Brand colours as surfaces (decision 2026-10-06): explicit roles with an automatically picked text colour.
surface_brand: $brand_primary
on_brand: "on-colour($surface_brand)"
surface_brand_secondary: $brand_secondary
on_brand_secondary: "on-colour($surface_brand_secondary)"

# Background
bgcolor: $white
footer_bg: $black
menu_background: transparent

# Colour Aliases
# impact and cta are DEPRECATED (2026-10-07): kept for end-case themes, mapped to the brand roles. New rules bind to
# the roles: $brand_primary / $brand_secondary for accents, $brand_*_on_light / _on_dark for text, $surface_brand for
# a brand-coloured surface with $on_brand as its text.
impact: $brand_secondary
cta: $brand_primary
de_emphasized: "neutral(50)"
de_activated: "neutral(30)"
link_colour: $on_light
link_colour_active: $brand_primary_on_light
link_colour_reversed: $on_dark
link_colour_active_reversed: $brand_primary_on_dark

# Neutral aliases
# NOTE: These values are deprecated and left backwards-compatibility. Use neutral() directly or make
# more meaningful aliases.
lightest_neutral: "neutral(5)"
lighter_neutral: "neutral(30)"
light_neutral: "neutral(40)"
neutral: "neutral()"
mid_neutral: "neutral(60)"
dark_neutral: "neutral(70)"
darker_neutral: "neutral(80)"
darkest_neutral: "neutral(90)"

## 02 LAYOUT
basesize: 1rem
blh: "$basesize * $base_line_height"

# Spacing
# Defined before Structure: masthead_clearance and others below are calculated from these factors.

mobile_grid_gap_factor: -1
grid_gap_factor: 0
block_spacing: 2
mobile_block_spacing: -2
edge_padding_factor: -1
mobile_edge_padding_factor: -2
text_element_spacing: 3px

# Structure
masthead_height: 40px
footer_height: 100px
admin_bar_height: 40px
admin_bar_tray: 40px // Second-tier admin bar
masthead_clearance: "rv($edge_padding_factor)"
masthead_clearance_mobile: "rv($mobile_edge_padding_factor)"
splash_height_mobile: auto
splash_height_tablet: auto
splash_height_desktop: 100vh
min_splash_height: 700px
proportional_width_unit: "math.div(100% - math.div(100,$scale),2)"
standard_sidebar_width: $proportional_width_unit
right_sidebar_width: $standard_sidebar_width
left_sidebar_width: "$standard_sidebar_width * 2"

footer_branding_width: 150px
footer_badge_width: "$footer_branding_width * 1.5"

# Breakpoints
breakpoints: "(xsml: 21em, sml: 30em, med: 46.25em, lrg: 75em, xlrg: 112.5em, xxlrg: 130em)"

stack_breakpoint: "'med'"
tablet_breakpoint: "'med'"
desktop_breakpoint: "'lrg'"
ultrawide_breakpoint: "'xlrg'"

stack: $stack_breakpoint
tablet: $tablet_breakpoint
desktop: $desktop_breakpoint
ultrawide: $ultrawide_breakpoint

## 03 TYPOGRAPHY | Note – fonts themselves must be declared elsewhere using load font. See docs.
# Example: +load_font('IBMPlexMono','ibmplexmono',($normal,$bold),(normal,italic))

font_path: "'../fonts'"

# Tables
row_header_bg: "neutral(10)"
row_border_color: "neutral(10)"
row_zebra_stripe_color: "neutral(3)"

# Deprecated. Use definitions e.g. %h1-font-size
h1fontsize: "map-get($sizefactors,'h1')"
h2fontsize: "map-get($sizefactors,'h2')"
h3fontsize: "map-get($sizefactors,'h3')"
h4fontsize: "map-get($sizefactors,'h4')"
h5fontsize: "map-get($sizefactors,'h5')"
h6fontsize: "map-get($sizefactors,'h6')"

## 04 UI | Needs an overhaul
ui_icon_size: 25px
ui_padding: 10px
ui_element_height: 40px
ui_minheight: $ui_element_height
ui_maxheight: 40px
ui_compactheight: 40px
facet_control_height: 32px
reference_letter_size: 2rem   # the alphabet letters of the Reference block's index (compact circles)   # text, number and select controls inside a facet and the date range (one step below the UI element height)
ui_largeheight: 80px
ui_max_text_width: 500px
ui_element_spacing: "rv($mobile_edge_padding_factor)"
ui_border_radius: 8px
ui_border_width: 1px
ui_border_color: "neutral(40)"
ui_hover_border_color: $brand_secondary
ui_checkbox_height: 20px
ui_element_font_size: "clamped(-1,0)"
ui_checkbox_label_font_size: "clamped(-1,0)"
ui_form_text_color: "neutral(90)"

# mobile ui controls

mobile_overlay_spacing: "rv(2)"
mobile_filter_height: "rv(5)"

# legacy
border_radius: $ui_border_radius

#Buttons
ui_button_classes: '".agile-button, .btn"'  # the selector(s) that carry the button design (library 3.0.0); Omeka core uses .button itself
btn_padding: "5px $ui_padding"
btn_border_width: 0
btn_border_radius: $ui_border_radius
btn_height: $ui_maxheight
btn_width: 280px
btn_compactwidth: 180px
btn_largewidth: 280px
btn_max_width: 375px
btn_icon_size: 25px

btn_fontsize: "clamped(0,1)"
btn_compact_fontsize: "clamped(-1,0)"
btn_minwidth: 250px
btn_submit_img_size: "rv(1)"

btn_color: $on_light
btn_bg_color: "neutral(20)"
btn_border_color: $ui_border_color
btn_hover_color: $on_light
btn_hover_border_color: "neutral(60)"
btn_hover_bg_color: "neutral(40)"

btn_submit_color: $on_impact
btn_submit_bg_color: $visual_impact
btn_submit_border_width: 0
btn_submit_border_color: $visual_impact
btn_submit_hover_color: "on-colour(mix($white,$visual_impact,10%))"
btn_submit_hover_border_color: "mix($white,$visual_impact,10%)"
btn_submit_hover_bg_color: "mix($white,$visual_impact,10%)"

btn_search_color: "neutral(70)"
btn_search_bg_color: $white
btn_search_border_width: $ui_border_width
btn_search_border_color: $ui_border_color
btn_search_hover_color: $on_light
btn_search_hover_border_color: $brand_secondary
btn_search_hover_bg_color: $white

btn_reset_color: "neutral(90)"
btn_reset_bg_color: "neutral(30)"
btn_reset_border_width: 0
btn_reset_border_color: "neutral(90)"
btn_reset_hover_color: "neutral(10)"
btn_reset_hover_bg_color: "neutral(90)"
btn_reset_hover_border_color: "neutral(90)"

outline_btn_color: $mid_neutral
outline_btn_hover_color: $ui_hover_border_color

ui_select_width: fit-content
ui_select_min_width: $btn_width
ui_select_max_width: "100%"

#Callouts

callout_shift: 0
callout_width: "40%"
callout_inset: null
callout_breakpoint: lrg

# Animation
heartbeat: 0.2s
standard_properties: "translate3d scale opacity background-color"
base_delay: null

## 00 VISIBILITY CONTROL
# Elements in the visibility stack are invisible (opacity: 0) by default. A “visible” class is added when the element
# scrolls into the viewport, allowing for build animations to be triggered.

visibility_stack: "('main > div','#secondary-content','#tertiary-content','#quaternary-content','.block-facets-block','#block-responses-profile-feature')"
remove_visibility_class: true
visibility_offset: 50
visibility_threshold: 0.2
visibility_stack_animation_speed: 0
visibility_stack_animation_delay: null

# Aliases
very_fast: $heartbeat
fast: "$heartbeat * 2"
slow: "$heartbeat * 4"
very_slow: "$heartbeat * 16"
sluggish: "$heartbeat * 32"

# Slide Timing
slide_transition: $slow

## 06 SITE ELEMENTS

card_border_radius: $border-radius
welcome_block_bg: $black
welcome_block_color: $on_dark
menu_color: $on_light
list_item_figure_width: 200px
list_item_figure_width_mobile: 120px   # the list card's image column below the tablet breakpoint (a 200px column leaves too little for the text on a phone)

# 06 Slide Viewer
default_next_btn: "'data:image/svg+xml;base64,'"
default_prev_btn: "'data:image/svg+xml;base64,'"
default_slide_item_template: 1
default_slide_viewer_template: 2
slide_viewer_padding: "rv(0)"
slide_viewer_marker_size: 10px
slide_viewer_ui_spacing: "rv(-1)"
slide_viewer_midpoint: "50%"
slide_viewer_background: $black
slide_viewer_mobile_height: 60vh   # slideshow height below the tablet breakpoint (in the splash it fills the viewport from desktop)
slide_viewer_tablet_height: 60vh
slide_counter_font_size: 0.875rem   # the "3 / 12" counter that replaces the page markers below the tablet breakpoint

page_marker_background: "neutral(30)"
page_marker_background_hover: $brand_secondary
page_marker_background_active: $brand_secondary
page_marker_border_radius: "50%"

page_marker_transform: none
page_marker_transform_hover: none
page_marker_transform_active: none
page_marker_width: $slide_viewer_marker_size
page_marker_height: $slide_viewer_marker_size

sequential_control_btn_height: 2rem
sequential_control_btn_width: 1.5rem

next_btn_background: "no-repeat url(#{$default_next_btn})"
previous_btn_background: "no-repeat right url(#{$default_prev_btn})"

circular_audio_color: $brand_primary
circular_audio_background: $white
circular_audio_caption_color: $on_light
transcript_highlight: "set-color(2,50)"
transcript_hover: "set-color(2,30)"

slide_content_background: none
slide_caption_background: none
slide_item_content_width: "100%"
slide_item_caption_width: "100%"

slide_item_portrait_object_fit: contain
slide_item_portrait_position: center
slide_item_portrait_slide_padding: 0

slide_item_landscape_object_fit: cover
slide_item_landscape_position: center
slide_item_landscape_slide_padding: 0

slide_item_square_object_fit: contain
slide_item_square_position: center
slide_item_square_slide_padding: 0

# Extended Styles. Most should be left default.
slide_nav_bottom: $slide_viewer_padding
slide_nav_top: initial
slide_nav_left: initial
slide_nav_right: initial
slide_nav_flex_direction: row
slide_nav_flex_wrap: wrap
slide_nav_justify_contents: center
slide_nav_align_items: center
slide_nav_height: $sequential_control_btn_height

page_marker_margin: 0 $slide_viewer_ui_spacing 0 0

# Sequential Slider Nav (next/previous)

sequential_nav_top: initial
sequential_nav_bottom: "rv($mobile_edge_padding_factor)"
sequential_nav_left: "50%"
sequential_nav_right: auto
sequential_nav_justify_content: space-between
sequential_nav_align_items: center
sequential_nav_transform: "translateX(-50%)"
sequential_control_spacing: $slide_viewer_ui_spacing

# Figure container (content + caption)

slide_item_slide_display: flex
slide_item_slide_flex_direction: column
slide_item_slide_flex_grow: 1
slide_item_slide_width: "100%"
slide_item_slide_height: "100%"

slide_item_slide_padding: 0
slide_item_slide_margin: 0

# Content container (usually contains an image)

slide_item_content_padding: 0

# Caption

slide_item_caption_padding: 0 $slide_viewer_padding
slide_item_caption_height: auto
slide_item_caption_position: absolute
slide_item_caption_bottom: 0

# Browser Element

exposed_facet_desktop_width: 350px
ui_mobile_app_controls_breakpoint: $desktop
ui_mobile_app_controls_footer_height: $masthead_height
ui_display_controls_icon_size: "$ui_mobile_app_controls_footer_height * 0.6"

# OHMS viewer (OHMS Embed module's iframe, on item pages)
ohms_viewer_height: 800px

# IIIF presentation page block (Mirador / Universal Viewer for a manifest URL)
iiif_block_height: 70vh
iiif_block_height_desktop: 640px

#mirador
mirador_height_mobile: 60vh
mirador_height_tablet: 50vh
mirador_height_desktop: 60vh
mirador_min_height: 400px
