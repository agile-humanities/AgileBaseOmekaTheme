; Generated by tools/build-simplified.js from simplified/theme.ini in the Advanced Agile Base Theme.
; Edit the source there, not this file. The version is copied from the Advanced theme at generation.

[info]
name = "Simplified Agile Base Theme"
version = "0.0.0"
author = "Agile Humanities Agency"
description = "A drop-in theme for any Omeka S site, generated from the Advanced Agile Base Theme. Plain CSS and CSS variables; no modules or build step required."
theme_link = "https://github.com/agile-humanities/AgileBaseOmekaThemeSimplified"
author_link = "https://agilehumanities.ca/"
omeka_version_constraint = "^4.2.0"

; Agile theme declaration, read by the Agile Theme Tools module when it is installed (this theme does not need it).
; Keep these keys if you copy or rename the theme. There is no agile_build key: this theme has no SASS build.
agile_base = "agile-base-simplified"
agile_base_version = "0.0.0"

[config]

; ---- Resource pages ----
; The item page's regions as the Advanced theme lays them out, with core Omeka blocks as the defaults so the page is
; complete on a stock install (core renders the "main" region; the title is printed by the page). With Agile Theme
; Tools, the module's "Agile site setup > Item pages" task, or the site's Configure resource pages form, switches the
; site to the module's blocks (item media, heading, summary and full metadata; Advanced Media's when installed).
; Only blocks that exist on every install may be listed here: Omeka fails on an unknown block name.

resource_page_regions.items.above = "Above Main"
resource_page_regions.items.main = "Main"

resource_page_blocks.items.main[] = "mediaEmbeds"
resource_page_blocks.items.main[] = "values"
resource_page_blocks.items.main[] = "linkedResources"

; ---- Identity ----

elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"

elements.nav_depth.name = "nav_depth"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Top Navigation Depth"
elements.nav_depth.options.info = "Maximum number of levels to show in the site's top navigation bar. Set to 0 to show all levels."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 0

; ---- Colours ----
; Each slot has a role. Leave a slot empty to keep the theme's default. Applied at once; no build needed.

elements.clr1.name = "clr1"
elements.clr1.type = "Omeka\Form\Element\ColorPicker"
elements.clr1.options.label = "Colour 1: primary brand colour"
elements.clr1.options.info = "Your main brand colour, used as the default accent and where the brand is established. Default #00BDD4."

elements.clr2.name = "clr2"
elements.clr2.type = "Omeka\Form\Element\ColorPicker"
elements.clr2.options.label = "Colour 2: secondary brand colour"
elements.clr2.options.info = "A second brand colour, used as an accent. Default #BF609B."

elements.clr3.name = "clr3"
elements.clr3.type = "Omeka\Form\Element\ColorPicker"
elements.clr3.options.label = "Colour 3: dark surface"
elements.clr3.options.info = "A dark colour a step in from black, for panels and bands that stand out from dark areas without contrasting with them. Default #0E3A40."

elements.clr4.name = "clr4"
elements.clr4.type = "Omeka\Form\Element\ColorPicker"
elements.clr4.options.label = "Colour 4: light surface"
elements.clr4.options.info = "A light colour a step in from white, for panels and bands that stand out from the page without contrasting with it. Default #EAF3F4."

elements.clr5.name = "clr5"
elements.clr5.type = "Omeka\Form\Element\ColorPicker"
elements.clr5.options.label = "Colour 5: visual impact"
elements.clr5.options.info = "Buttons and calls to action. Default #D98536."

elements.clr6.name = "clr6"
elements.clr6.type = "Omeka\Form\Element\ColorPicker"
elements.clr6.options.label = "Colour 6: accent"
elements.clr6.options.info = "Default #315FAA."

elements.clr7.name = "clr7"
elements.clr7.type = "Omeka\Form\Element\ColorPicker"
elements.clr7.options.label = "Colour 7: accent"
elements.clr7.options.info = "Default #7DBF60."

elements.clr8.name = "clr8"
elements.clr8.type = "Omeka\Form\Element\ColorPicker"
elements.clr8.options.label = "Colour 8: accent"
elements.clr8.options.info = "Default #E1BB0B."

elements.clr9.name = "clr9"
elements.clr9.type = "Omeka\Form\Element\ColorPicker"
elements.clr9.options.label = "Colour 9: accent"
elements.clr9.options.info = "Default #E5336D."

; ---- Fonts ----
; CSS font-family lists. The theme bundles Roboto, Source Serif and IBM Plex Mono; other fonts need an embed code below.

elements.basefont.name = "basefont"
elements.basefont.type = "Laminas\Form\Element\Text"
elements.basefont.options.label = "Body font"
elements.basefont.options.info = "A CSS font-family list, e.g. Roboto, Helvetica, Arial, sans-serif. Leave empty for the theme default."

elements.headingfont.name = "headingfont"
elements.headingfont.type = "Laminas\Form\Element\Text"
elements.headingfont.options.label = "Heading font"
elements.headingfont.options.info = "A CSS font-family list. Leave empty for the theme default."

elements.altfont.name = "altfont"
elements.altfont.type = "Laminas\Form\Element\Text"
elements.altfont.options.label = "Alternate font"
elements.altfont.options.info = "Used for quotations and similar set-apart text. Leave empty for the theme default."

elements.codefont.name = "codefont"
elements.codefont.type = "Laminas\Form\Element\Text"
elements.codefont.options.label = "Code font"
elements.codefont.options.info = "A monospace font-family list. Leave empty for the theme default."

elements.font_embed.name = "font_embed"
elements.font_embed.attributes.id = "font_embed"
elements.font_embed.type = "Laminas\Form\Element\Text"
elements.font_embed.options.label = "Font embed code"
elements.font_embed.options.info = "HTML that loads fonts from a service (Google Fonts, Adobe Fonts), placed in the page head before the stylesheets."

; ---- Cards ----

elements.card_terms.name = "card_terms"
elements.card_terms.attributes.id = "card_terms"
elements.card_terms.type = "Laminas\Form\Element\Text"
elements.card_terms.options.label = "Card Terms"
elements.card_terms.options.info = "Metadata to show on cards besides the title and creator, as a comma-separated list of terms in order, e.g. dcterms:created,dcterms:date. Empty: Date Created and Date."

; ---- Footer ----

elements.footer_logo.name = "footer_logo"
elements.footer_logo.type = "Omeka\Form\Element\Asset"
elements.footer_logo.options.label = "Footer Logo"

elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "HTML content to appear in the footer"
elements.footer.attributes.value = "Powered by Agile Humanities"

elements.footer_links.name = "footer_links"
elements.footer_links.attributes.id = "footer_links"
elements.footer_links.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer_links.options.label = "Footer Links"
elements.footer_links.options.info = "HTML link content to appear in the footer"
elements.footer_links.attributes.value = "<nav><ul><li><a href='#'>Example Link</a></li></ul></nav>"

elements.footer_sponsor_logos.name = "footer_sponsor_logos"
elements.footer_sponsor_logos.type = "Omeka\Form\Element\Asset"
elements.footer_sponsor_logos.options.label = "Footer Sponsor Logos"
elements.footer_sponsor_logos.options.info = "An optional pre-made grid of sponsor/institutional logos"

elements.footer_sponsor_html.name = "footer_sponsor_html"
elements.footer_sponsor_html.attributes.id = "footer_sponsor_html"
elements.footer_sponsor_html.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer_sponsor_html.options.label = "Sponsor Area HTML"
elements.footer_sponsor_html.options.info = "Sponsor information for footer. Use in place of sponsor logos. Allows you to use more complex HTML to provide sponsor images with links"
